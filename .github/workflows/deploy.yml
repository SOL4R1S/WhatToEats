name: Deploy to OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Create production environment file
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          BACKEND_PUBLIC_URL: ${{ secrets.BACKEND_PUBLIC_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AGENT_KEY: ${{ secrets.AGENT_KEY }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env.production <<EOF
          MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID
          KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET
          FRONTEND_URL=$FRONTEND_URL
          BACKEND_PUBLIC_URL=$BACKEND_PUBLIC_URL
          ADMIN_USERNAME=$ADMIN_USERNAME
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          AGENT_KEY=$AGENT_KEY
          EOF

      - name: Upload production environment file
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          scp -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/deploy_key" \
            -P "$OCI_PORT" \
            .env.production \
            "$OCI_USER@$OCI_HOST:/home/ubuntu/WhatToEat/.env.production"

      - name: Deploy to OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_PORT: ${{ secrets.OCI_PORT }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail
          ssh -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/deploy_key" \
            -p "$OCI_PORT" \
            "$OCI_USER@$OCI_HOST" \
            'set -e
             cd /home/ubuntu/WhatToEat
             git pull --ff-only origin main
             docker compose --env-file .env.production up -d --build
             for i in $(seq 1 30); do
               if curl -fsS http://127.0.0.1:8081/api/v1/restaurants > /dev/null; then
                 echo "backend is healthy"
                 exit 0
               fi
               sleep 2
             done
             echo "backend failed to become healthy"
             docker compose --env-file .env.production logs --tail=100 backend
             exit 1'
