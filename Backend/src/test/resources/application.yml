spring:
  datasource:
    url: jdbc:h2:mem:whattoeat
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    # 테스트는 H2 + create-drop 사용. V1의 MySQL 문법이 H2에서 실행되지 않도록 off.
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMTIzNDU2Nzg=
  access-expiration: 3600000
  refresh-expiration: 604800000

app:
  upload:
    path: uploads
    url-prefix: /uploads
